services:
  timescaledb:
    image: timescale/timescaledb:2.17.0-pg17
    container_name: zero-stockout-timescaledb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: inventory
    ports:
      - '5432:5432'
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: zero-stockout-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26.0
    container_name: zero-stockout-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ['CMD', 'cypher-shell', '-u', 'neo4j', '-p', 'password', 'RETURN 1']
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:1.5.3
    container_name: zero-stockout-chromadb
    ports:
      - '8000:8000'
    environment:
      IS_PERSISTENT: TRUE
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/heartbeat']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: zero-stockout-backend
    ports:
      - '8000:8000'
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:admin@timescaledb:5432/inventory
      REDIS_URL: redis://redis:6379
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      CHROMA_URL: http://chromadb:8000
    volumes:
      - ./backend:/app
    command: uvicorn api.routes:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: zero-stockout-frontend
    ports:
      - '8501:8501'
    depends_on:
      backend:
        condition: service_started
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./frontend:/app

volumes:
  timescale-data:
  neo4j-data:
  chroma-data:
